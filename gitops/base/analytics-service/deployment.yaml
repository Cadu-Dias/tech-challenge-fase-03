apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-service
  namespace: toggle
  labels: { app: analytics-service }
spec:
  replicas: 1
  selector:
    matchLabels: { app: analytics-service }
  template:
    metadata:
      labels: { app: analytics-service }
    spec:
      containers:
        - name: analytics-service
          image: 473556687259.dkr.ecr.us-east-1.amazonaws.com/toggle/analytics-service:latest
          ports:
            - containerPort: 8005
          envFrom:
            - configMapRef: { name: analytics-config }
          resources:
            requests: { cpu: "50m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
          readinessProbe:
            httpGet: { path: /health, port: 8005 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8005 }
            initialDelaySeconds: 10
            periodSeconds: 15
