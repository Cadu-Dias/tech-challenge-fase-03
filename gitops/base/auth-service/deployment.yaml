apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: toggle
  labels: { app: auth-service }
spec:
  replicas: 2
  selector:
    matchLabels: { app: auth-service }
  template:
    metadata:
      labels: { app: auth-service }
    spec:
      containers:
        - name: auth-service
          image: 473556687259.dkr.ecr.us-east-1.amazonaws.com/toggle/auth-service:latest
          ports:
            - containerPort: 8001
          envFrom:
            - configMapRef: { name: auth-config }
            - secretRef: { name: auth-secret }
          resources:
            requests: { cpu: "100m", memory: "64Mi" }
            limits: { cpu: "500m", memory: "128Mi" }
          readinessProbe:
            httpGet: { path: /health, port: 8001 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8001 }
            initialDelaySeconds: 10
            periodSeconds: 15
