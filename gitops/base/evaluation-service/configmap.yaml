apiVersion: v1
kind: ConfigMap
metadata:
  name: evaluation-config
  namespace: toggle
data:
  PORT: "8004"
  # REDIS_URL, AWS_SQS_URL são parametrizados por patch no overlay
  # gitops/overlays/prod (valores reais vêm dos outputs do Terraform:
  # module.elasticache.endpoint / module.sqs.queue_url).
  REDIS_URL: "redis://CHANGE_ME:6379"
  FLAG_SERVICE_URL: "http://flag-service:8002"
  TARGETING_SERVICE_URL: "http://targeting-service:8003"
  AWS_REGION: "us-east-1"
  AWS_SQS_URL: "https://sqs.us-east-1.amazonaws.com/473556687259/toggle-events"
